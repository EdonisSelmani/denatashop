services:
  - type: web
    name: denataashop-testing
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: DenataShop
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://denataashop-testing.onrender.com
      - key: ASSET_URL
        value: https://denataashop-testing.onrender.com
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: sq
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_TIMEZONE
        value: Europe/Belgrade
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: RUN_CATALOG_IMPORT
        value: false
      - key: RUN_CATALOG_IMPORT_DRY_RUN
        value: false
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_ENCRYPT
        value: true
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: DEBUGBAR_ENABLED
        value: false
      - key: MAIL_MAILER
        value: log
